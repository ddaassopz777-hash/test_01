<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Task Progress Widget</title>
    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Шрифт Inter для эстетики Notion -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            bgLight: '#ffffff',
                            bgDark: '#191919',
                            cardLight: '#f7f6f3',
                            cardDark: '#202020',
                            borderLight: '#e9e9e8',
                            borderDark: '#2f2f2f',
                            textLight: '#37352f',
                            textDark: '#rgba(255, 255, 255, 0.81)',
                            subtleLight: '#787774',
                            subtleDark: '#9b9b9b',
                            accent: '#2eaadc',
                            accentHover: '#0081b5',
                            accentBg: 'rgba(46, 170, 220, 0.1)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Стилизация ползунка range */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Ползунок для Webkit (Chrome, Safari, Edge) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #2eaadc;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.1s ease, background-color 0.2s;
        }

        .dark input[type=range]::-webkit-slider-thumb {
            background: #252525;
            border-color: #2eaadc;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type=range]::-webkit-slider-thumb:active {
            transform: scale(0.95);
        }

        /* Дорожка ползунка */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            border-radius: 3px;
        }

        /* Firefox стили */
        input[type=range]::-moz-range-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #2eaadc;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .dark input[type=range]::-moz-range-thumb {
            background: #252525;
            border-color: #2eaadc;
        }

        /* Плавные переходы для темы */
        .theme-transition {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-notion-bgLight dark:bg-notion-bgDark text-notion-textLight dark:text-gray-200 font-sans min-h-screen flex items-center justify-center p-4 theme-transition select-none">

    <!-- Основной контейнер виджета -->
    <div class="w-full max-w-sm bg-notion-cardLight dark:bg-notion-cardDark border border-notion-borderLight dark:border-notion-borderDark rounded-xl p-5 shadow-sm theme-transition">
        
        <!-- Шапка: заголовок и переключатель темы -->
        <div class="flex items-center justify-between mb-3 gap-2">
            <!-- Редактируемое название задачи -->
            <input 
                type="text" 
                id="taskTitle" 
                value="Скрафтить таблички" 
                placeholder="Введите название..."
                class="bg-transparent font-semibold text-lg focus:outline-none border-b border-transparent focus:border-notion-accent text-ellipsis overflow-hidden whitespace-nowrap w-full transition-colors duration-200"
                title="Нажмите, чтобы изменить название"
            />
            
            <!-- Переключатель темы -->
            <button id="themeToggle" class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200/50 dark:hover:bg-gray-800 transition-all flex-shrink-0" title="Сменить тему">
                <!-- Иконка Солнце (Light) -->
                <svg id="sunIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
                <!-- Иконка Луна (Dark) -->
                <svg id="moonIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </button>
        </div>

        <!-- Большой индикатор процентов -->
        <div class="flex items-baseline justify-between mb-4">
            <div class="flex items-baseline">
                <span id="percentValue" class="text-5xl font-extrabold tracking-tight text-notion-textLight dark:text-white transition-all">0</span>
                <span class="text-2xl font-bold ml-1 text-notion-accent">%</span>
            </div>
            <!-- Статус выполнения -->
            <span id="statusBadge" class="text-xs px-2.5 py-1 rounded-full font-medium bg-gray-200/60 dark:bg-gray-800 text-gray-600 dark:text-gray-400 transition-all">
                В процессе
            </span>
        </div>

        <!-- Визуальный Прогресс-бар -->
        <div class="relative w-full h-3 bg-gray-200 dark:bg-gray-800 rounded-full overflow-hidden mb-4">
            <div id="progressBar" class="h-full bg-notion-accent rounded-full transition-all duration-150 ease-out" style="width: 0%"></div>
        </div>

        <!-- Интерактивный Ползунок (Range input) -->
        <div class="mb-5">
            <input 
                type="range" 
                id="progressSlider" 
                min="0" 
                max="100" 
                value="0" 
                step="1"
                class="cursor-pointer"
            >
        </div>

        <!-- Панель кнопок быстрых действий -->
        <div class="grid grid-cols-5 gap-1.5 mb-2">
            <button onclick="changeProgress(-5)" class="py-1.5 text-xs font-semibold rounded-md bg-white dark:bg-notion-bgDark border border-notion-borderLight dark:border-notion-borderDark hover:bg-gray-100 dark:hover:bg-gray-800 active:scale-95 transition-all">-5%</button>
            <button onclick="changeProgress(-1)" class="py-1.5 text-xs font-semibold rounded-md bg-white dark:bg-notion-bgDark border border-notion-borderLight dark:border-notion-borderDark hover:bg-gray-100 dark:hover:bg-gray-800 active:scale-95 transition-all">-1%</button>
            <button onclick="changeProgress(1)" class="py-1.5 text-xs font-semibold rounded-md bg-white dark:bg-notion-bgDark border border-notion-borderLight dark:border-notion-borderDark hover:bg-gray-100 dark:hover:bg-gray-800 active:scale-95 transition-all">+1%</button>
            <button onclick="changeProgress(5)" class="py-1.5 text-xs font-semibold rounded-md bg-white dark:bg-notion-bgDark border border-notion-borderLight dark:border-notion-borderDark hover:bg-gray-100 dark:hover:bg-gray-800 active:scale-95 transition-all">+5%</button>
            <button id="toggleCompleteBtn" onclick="toggleComplete()" class="py-1.5 text-xs font-semibold rounded-md bg-notion-accent/10 dark:bg-notion-accent/20 text-notion-accent hover:bg-notion-accent hover:text-white dark:hover:bg-notion-accent dark:hover:text-white active:scale-95 transition-all">100%</button>
        </div>
    </div>

    <!-- Логика работы виджета -->
    <script>
        // Элементы DOM
        const slider = document.getElementById('progressSlider');
        const progressBar = document.getElementById('progressBar');
        const percentValue = document.getElementById('percentValue');
        const taskTitle = document.getElementById('taskTitle');
        const statusBadge = document.getElementById('statusBadge');
        const toggleCompleteBtn = document.getElementById('toggleCompleteBtn');
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Ключи для localStorage
        const STORAGE_KEY_PROGRESS = 'notion_widget_progress';
        const STORAGE_KEY_TITLE = 'notion_widget_title';
        const STORAGE_KEY_THEME = 'notion_widget_theme';

        // Инициализация данных
        let currentProgress = parseInt(localStorage.getItem(STORAGE_KEY_PROGRESS)) || 0;
        let savedTitle = localStorage.getItem(STORAGE_KEY_TITLE) || 'Скрафтить таблички';

        // Применение загруженных значений
        slider.value = currentProgress;
        taskTitle.value = savedTitle;

        // Обновление интерфейса
        function updateUI(value) {
            currentProgress = Math.min(100, Math.max(0, parseInt(value) || 0));
            slider.value = currentProgress;
            percentValue.textContent = currentProgress;
            progressBar.style.width = currentProgress + '%';

            // Обновление статуса и кнопки завершения
            if (currentProgress === 100) {
                statusBadge.textContent = 'Готово 🎉';
                statusBadge.className = 'text-xs px-2.5 py-1 rounded-full font-medium bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-400 transition-all';
                toggleCompleteBtn.textContent = 'Сброс';
            } else if (currentProgress === 0) {
                statusBadge.textContent = 'Не начато';
                statusBadge.className = 'text-xs px-2.5 py-1 rounded-full font-medium bg-gray-200/60 dark:bg-gray-800 text-gray-600 dark:text-gray-400 transition-all';
                toggleCompleteBtn.textContent = '100%';
            } else {
                statusBadge.textContent = 'В процессе';
                statusBadge.className = 'text-xs px-2.5 py-1 rounded-full font-medium bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-400 transition-all';
                toggleCompleteBtn.textContent = '100%';
            }

            // Сохранение прогресса
            localStorage.setItem(STORAGE_KEY_PROGRESS, currentProgress);
        }

        // Изменение прогресса ползунком
        slider.addEventListener('input', (e) => {
            updateUI(e.target.value);
        });

        // Изменение через кнопки + / -
        function changeProgress(delta) {
            updateUI(currentProgress + delta);
        }

        // Кнопка быстрого переключения 100% / 0%
        function toggleComplete() {
            if (currentProgress === 100) {
                updateUI(0);
            } else {
                updateUI(100);
            }
        }

        // Сохранение названия задачи при вводе
        taskTitle.addEventListener('input', (e) => {
            localStorage.setItem(STORAGE_KEY_TITLE, e.target.value);
        });

        // Работа с темой (Dark / Light)
        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.classList.add('dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                localStorage.setItem(STORAGE_KEY_THEME, 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                localStorage.setItem(STORAGE_KEY_THEME, 'light');
            }
        }

        // Инициализация темы
        const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        // Переключение темы по клику
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');
            setTheme(!isDark);
        });

        // Запуск UI при загрузке
        updateUI(currentProgress);
    </script>
</body>
</html>
